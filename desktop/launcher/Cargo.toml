[package]
name = "rogue-agent"
version = "0.1.0"
edition = "2021"
description = "Native Windows window for the Rogue Agent decompiler"
license = "MIT"
publish = false

[[bin]]
name = "RogueAgent"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
open = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.34"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
wry = { version = "0.53", default-features = false, features = ["drag-drop"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
